name: linuxfest

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: Asia/Tehran
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal

  minio-init:
    image: ${BACKEND_IMAGE:-ghcr.io/linuxfestival/backend-v2}:${BACKEND_IMAGE_TAG:?set BACKEND_IMAGE_TAG in .env}
    restart: "no"
    entrypoint: ["python", "-c"]
    command:
      - |
        import json, os
        import boto3
        from botocore.exceptions import ClientError

        bucket = os.environ["MINIO_BUCKET"]
        client = boto3.client(
            "s3",
            endpoint_url="http://minio:9000",
            aws_access_key_id=os.environ["MINIO_ROOT_USER"],
            aws_secret_access_key=os.environ["MINIO_ROOT_PASSWORD"],
            region_name="us-east-1",
        )
        try:
            client.create_bucket(Bucket=bucket)
        except ClientError as error:
            if error.response["Error"]["Code"] not in {
                "BucketAlreadyExists",
                "BucketAlreadyOwnedByYou",
            }:
                raise
        client.put_bucket_policy(
            Bucket=bucket,
            Policy=json.dumps({
                "Version": "2012-10-17",
                "Statement": [{
                    "Effect": "Allow",
                    "Principal": "*",
                    "Action": ["s3:GetObject"],
                    "Resource": [f"arn:aws:s3:::{bucket}/*"],
                }],
            }),
        )
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - internal

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/linuxfestival/backend-v2}:${BACKEND_IMAGE_TAG:?set BACKEND_IMAGE_TAG in .env}
    restart: unless-stopped
    environment:
      SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CORS_ALLOW_ALL_ORIGINS: "False"
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-True}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-31536000}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-True}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-True}
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: db
      DB_PORT: "5432"
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
      SMS_KEY: ${SMS_KEY:-}
      SMS_LINE_NUMBER: ${SMS_LINE_NUMBER:-}
      EMAIL_VERIFICATION_ENABLED: ${EMAIL_VERIFICATION_ENABLED:-False}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-LinuxFest}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-True}
      MAIL_USE_SSL: ${MAIL_USE_SSL:-False}
      MAIL_TIMEOUT: ${MAIL_TIMEOUT:-10}
      EMAIL_OTP_TTL_SECONDS: ${EMAIL_OTP_TTL_SECONDS:-600}
      EMAIL_OTP_RESEND_SECONDS: ${EMAIL_OTP_RESEND_SECONDS:-60}
      EMAIL_OTP_MAX_ATTEMPTS: ${EMAIL_OTP_MAX_ATTEMPTS:-5}
      PAYMENT_API_KEY: ${PAYMENT_API_KEY:-}
      PAYMENT_CALLBACK_URL: ${PAYMENT_CALLBACK_URL:-}
      PAYMENT_START_URL: ${PAYMENT_START_URL:-}
      PAYMENT_RETURN_URL: ${PAYMENT_RETURN_URL:-}
      PAYMENT_HTTP_CONNECT_TIMEOUT: ${PAYMENT_HTTP_CONNECT_TIMEOUT:-5}
      PAYMENT_HTTP_READ_TIMEOUT: ${PAYMENT_HTTP_READ_TIMEOUT:-15}
      PAYMENT_PENDING_TTL_SECONDS: ${PAYMENT_PENDING_TTL_SECONDS:-1800}
      USE_S3: "True"
      BUCKET_ENDPOINT: http://minio:9000
      BUCKET_NAME: ${MINIO_BUCKET}
      BUCKET_ACCESS_KEY: ${MINIO_ROOT_USER}
      BUCKET_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      BUCKET_PUBLIC_DOMAIN: ${SITE_ADDRESS}/media
      BUCKET_URL_PROTOCOL: "https:"
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/health/', headers={'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r, timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    tmpfs:
      - /tmp
    networks:
      - internal

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/linuxfestival/14th-linux-fest-frontend}:${FRONTEND_IMAGE_TAG:?set FRONTEND_IMAGE_TAG in .env}
    restart: unless-stopped
    environment:
      API_BASE_URL: /
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - internal

  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
      ACME_EMAIL: ${ACME_EMAIL:-}
      MINIO_BUCKET: ${MINIO_BUCKET}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
